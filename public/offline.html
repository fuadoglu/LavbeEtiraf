<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="">
    <title></title>
    <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: var(--theme-page, Canvas); color: var(--theme-text, CanvasText); }
        body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: clamp(.75rem, 4vw, 1.5rem); box-sizing: border-box; }
        main { box-sizing: border-box; inline-size: min(100%, 32rem); padding: clamp(1rem, 5vw, 2rem); border: 1px solid var(--theme-edge, GrayText); border-radius: .8rem; background: var(--theme-surface, Canvas); overflow-wrap: anywhere; text-align: center; box-shadow: var(--theme-shadow, none); }
        h1 { margin: 0; font: 600 clamp(1.6rem, 5vw, 2.4rem)/1.15 Charter, "Iowan Old Style", Georgia, "Noto Serif", serif; text-wrap: balance; }
        p { margin: .85rem 0 1.2rem; line-height: 1.65; }
        button { min-height: 2.75rem; max-inline-size: 100%; border: 0; border-radius: .65rem; padding: .65rem 1.2rem; background: var(--theme-action, ButtonFace); color: var(--theme-action-contrast, ButtonText); font: inherit; cursor: pointer; }
        button:focus-visible { outline: 3px solid var(--theme-action, Highlight); outline-offset: 3px; }
    </style>
</head>
<body>
<main>
    <h1 data-offline-title>You’re offline</h1>
    <p data-offline-body>When you reconnect, you can return to the page you wanted to read.</p>
    <button type="button" data-offline-retry>Try again</button>
</main>
<script>
    const retry = document.querySelector('[data-offline-retry]');
    retry.addEventListener('click', () => location.reload());
    fetch('/offline-copy.json').then((response) => {
        if (!response.ok) throw new Error('Offline copy unavailable');
        return response.json();
    }).then((catalog) => {
        const entries = Object.keys(catalog.messages);
        const resolveLocale = (tag) => {
            if (!tag) return null;
            const normalized = tag.toLowerCase();
            return entries.find((entry) => entry.toLowerCase() === normalized)
                || entries.find((entry) => entry.toLowerCase() === normalized.split('-')[0]);
        };
        const requestedLocale = new URLSearchParams(location.search).get('locale');
        const locale = resolveLocale(requestedLocale)
            || (navigator.languages || [navigator.language]).map(resolveLocale).find(Boolean)
            || 'en';
        const messages = catalog.messages[locale] || catalog.messages.en;
        let savedTheme;
        try {
            savedTheme = globalThis.localStorage?.getItem('lavbe-theme');
        } catch {
            // A blocked storage preference falls back to the system setting.
        }
        const night = savedTheme === 'night'
            || (savedTheme !== 'day' && globalThis.matchMedia?.('(prefers-color-scheme: dark)').matches);
        const palette = night && catalog.nightTheme ? catalog.nightTheme : catalog.theme;
        for (const [key, value] of Object.entries(palette)) document.documentElement.style.setProperty(`--theme-${key.replaceAll('_', '-')}`, value);
        document.documentElement.style.setProperty('color-scheme', palette === catalog.nightTheme ? 'dark' : 'light');
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = palette.page;
        document.documentElement.lang = locale;
        document.documentElement.dir = messages.dir;
        document.title = messages.title;
        document.querySelector('[data-offline-title]').textContent = messages.title;
        document.querySelector('[data-offline-body]').textContent = messages.body;
        retry.textContent = messages.retry;
    }).catch(() => {});
</script>
</body>
</html>
